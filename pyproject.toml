[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-creator-engine"
version = "0.2.0"
description = "Local-first autonomous software discovery, engineering intelligence and creation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SPIDER CREATOR ENGINE contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
sce = "sce.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
